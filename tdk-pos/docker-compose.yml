services:
  tdk-pos:
    build:
      context: .
      dockerfile: Dockerfile
    image: tdk-pos:1.0.0
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      QR_TITLE_IMAGE_STORAGE_PATH: /app/storage/qr-title
      QR_NOTICE_IMAGE_STORAGE_PATH: /app/storage/qr-notices
    network_mode: host
    volumes:
      - ./public/uploads/menu:/app/public/uploads/menu
      - ./storage/receipt-logo:/app/storage/receipt-logo
      - ./storage/qr-title:/app/storage/qr-title
      - ./storage/qr-notices:/app/storage/qr-notices
